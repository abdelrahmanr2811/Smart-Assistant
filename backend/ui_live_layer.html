  <!-- LIVE DATA LAYER: overrides static handlers with real API calls -->
  <script>
    const API = '/api/v1';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = n => Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    let LIVE = { projects: [], activities: [], kpi: null };
    let editingActivityId = null;

    async function api(path, opts = {}) {
      const token = localStorage.getItem('spma_token');
      opts.headers = Object.assign({}, opts.headers || {});
      if (token) opts.headers['Authorization'] = 'Bearer ' + token;
      if (opts.body && !(opts.body instanceof FormData)) opts.headers['Content-Type'] = 'application/json';
      const res = await fetch(API + path, opts);
      if (!res.ok) throw new Error((await res.text()).slice(0, 200) || res.statusText);
      return res.json();
    }

    function statusBadge(st) {
      const s = String(st || '').toLowerCase();
      const isAr = currentLang === 'ar';
      if (s.includes('delay')) return [isAr ? 'متأخر' : 'Delayed', 'bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300'];
      if (s.includes('complete')) return [isAr ? 'مكتمل' : 'Completed', 'bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300'];
      return [isAr ? 'قيد التنفيذ' : 'In Progress', 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300'];
    }
    const pct = a => a.planned_value > 0 ? Math.min(100, Math.round(a.earned_value / a.planned_value * 100)) : 0;

    async function loadLive() {
      try {
        const [projects, activities, kpi] = await Promise.all([
          api('/projects'), api('/documents/activities'), api('/documents/kpi-summary')
        ]);
        LIVE = { projects, activities, kpi };
        renderLive();
      } catch (e) { console.warn('Live data unavailable, showing demo data:', e.message); }
    }

    function renderLive() {
      const { projects, activities } = LIVE;
      const delayed = activities.filter(a => String(a.status).toLowerCase().includes('delay')).length;
      const completedProjects = projects.filter(p => !p.is_active || String(p.status || '').toLowerCase() === 'completed' || String(p.health_status || '').toLowerCase() === 'completed').length;
      const activeProjects = projects.filter(p => p.is_active).length || (projects.length - completedProjects);
      const totalAC = activities.reduce((s, a) => s + (a.actual_cost || 0), 0);
      const totalBudget = projects.reduce((s, p) => s + (p.total_budget || 0), 0);
      const avg = activities.length ? Math.round(activities.reduce((s, a) => s + pct(a), 0) / activities.length) : 76;
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      set('kpi-total-projects', projects.length);
      set('kpi-active-projects', activeProjects);
      set('kpi-completed-projects', completedProjects);
      set('kpi-delayed-activities', delayed);
      set('kpi-budget-used', (totalBudget ? (totalAC / totalBudget * 100) : 67.5).toFixed(1) + '%');
      set('kpi-avg-progress', avg + '%');
      renderDashboardCards(projects, activities, delayed, completedProjects, activeProjects, totalAC, totalBudget, avg);

      const grid = document.getElementById('projects-container');
      if (grid && projects.length) {
        grid.innerHTML = projects.map(p => {
          const pname = getBilingualProjectName(p);
          return `<div class="bg-white dark:bg-[#0B1E3B] rounded-2xl border border-slate-100 dark:border-slate-800 p-5 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2 py-0.5 ${p.is_active ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'} rounded text-[10px] font-bold">${p.is_active ? (currentLang === 'ar' ? 'نشط' : 'Active') : (currentLang === 'ar' ? 'غير نشط' : 'Inactive')}</span>
              <span class="text-xs font-bold text-slate-400">${esc(p.code)}</span>
            </div>
            <div>
              <h3 class="font-bold text-sm text-[#0B1E3B] dark:text-white">${esc(pname)}</h3>
              <p class="text-xs text-slate-400">${esc(p.currency)} ${fmt(p.total_budget)} ${currentLang === 'ar' ? 'الميزانية' : 'Budget'}</p>
            </div>
            <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
              <span class="text-slate-500 dark:text-slate-400">${p.activities_count} ${currentLang === 'ar' ? 'أنشطة' : 'Activities'}</span>
              <div class="flex gap-3">
                ${p.is_active ? '' : `<button onclick="activateProject('${esc(p.project_id)}')" class="text-emerald-600 font-bold hover:underline">${currentLang === 'ar' ? 'تفعيل' : 'Activate'}</button>`}
                <button onclick="openWorkspaceModal('${esc(p.project_id)}')" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">${currentLang === 'ar' ? 'بيئة العمل' : 'Workspace'}</button>
                <button onclick="deleteProject('${esc(p.project_id)}')" class="text-rose-600 font-bold hover:underline">${currentLang === 'ar' ? 'حذف' : 'Delete'}</button>
              </div>
            </div>
          </div>`;
        }).join('');
      }

      const sel = document.getElementById('global-project-select');
      if (sel && projects.length) {
        sel.innerHTML = projects.map(p => {
          const pname = getBilingualProjectName(p);
          return `<option value="${esc(p.project_id)}" ${p.is_active ? 'selected' : ''}>${esc(pname)}</option>`;
        }).join('');
      }

      const activePrj = projects.find(p => p.is_active) || projects[0];
      const prjId = activePrj ? activePrj.project_id : 'PRJ-01';
      if (activePrj) {
        try { localStorage.setItem('spma_selected_project_id', activePrj.project_id); } catch (e) {}
        const aiPrjNameEl = document.getElementById('ai-active-project-name');
        if (aiPrjNameEl) aiPrjNameEl.textContent = getBilingualProjectName(activePrj);
      }
      const pdfBtn = document.getElementById('btn-export-pdf');
      if (pdfBtn) pdfBtn.href = `/api/v1/reports/export/pdf?project_id=${encodeURIComponent(prjId)}`;
      const excelBtn = document.getElementById('btn-export-excel');
      if (excelBtn) excelBtn.href = `/api/v1/reports/export/excel?project_id=${encodeURIComponent(prjId)}`;

      const tbody = document.getElementById('activities-tbody');
      if (tbody) {
        const isAr = currentLang === 'ar';
        const active = projects.find(p => p.is_active);
        const delCount = activities.filter(a => String(a.status).toLowerCase().includes('delay')).length;
        const compCount = activities.filter(a => String(a.status).toLowerCase().includes('complete')).length;
        const progCount = activities.length - delCount - compCount;

        const setTab = (id, label, n) => {
          const btn = document.getElementById(id);
          if (btn) btn.textContent = `${label} (${n})`;
        };
        setTab('act-tab-all', isAr ? 'الكل' : 'All', activities.length);
        setTab('act-tab-delayed', isAr ? 'المتأخرة' : 'Delayed', delCount);
        setTab('act-tab-in_progress', isAr ? 'قيد التنفيذ' : 'In Progress', progCount);
        setTab('act-tab-completed', isAr ? 'المكتملة' : 'Completed', compCount);

        tbody.innerHTML = activities.map(a => {
          const [label, cls] = statusBadge(a.status);
          const stAttr = String(a.status).toLowerCase().includes('delay') ? 'delayed' : String(a.status).toLowerCase().includes('complete') ? 'completed' : 'in_progress';
          const actName = getBilingualActivityName(a.name);
          const prjName = active ? getBilingualProjectName(active) : '-';
          const teamName = getBilingualTeamName(a.assigned_team);
          return `<tr class="hover:bg-slate-50 dark:hover:bg-[#0E2447]" data-status="${stAttr}">
            <td class="p-3.5 font-bold text-slate-900 dark:text-white">${esc(actName)}</td>
            <td class="p-3.5 text-slate-500 dark:text-slate-400">${esc(prjName)}</td>
            <td class="p-3.5 text-slate-500 dark:text-slate-400">${esc(teamName)}</td>
            <td class="p-3.5"><span class="px-2 py-0.5 ${cls} rounded text-[10px] font-bold">${label}</span></td>
            <td class="p-3.5 text-slate-500 dark:text-slate-400">${esc(a.finish_date)}</td>
            <td class="p-3.5 font-bold text-emerald-600 dark:text-emerald-400">${pct(a)}%</td>
            <td class="p-3.5 tabular-nums">${fmt(a.actual_cost)}</td>
            <td class="p-3.5 text-right"><div class="flex items-center justify-end gap-2">
              <button onclick="openEditActivityById('${esc(a.activity_id)}')" class="px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-lg font-bold text-indigo-700 dark:text-indigo-300">${isAr ? 'تعديل' : 'Edit'}</button>
              <button onclick="deleteActivity('${esc(a.activity_id)}')" class="px-2.5 py-1 bg-rose-50 dark:bg-rose-950 hover:bg-rose-100 text-rose-600 rounded-lg font-bold">${isAr ? 'حذف' : 'Delete'}</button>
            </div></td></tr>`;
        }).join('') || `<tr><td colspan="8" class="p-6 text-center text-slate-400">${isAr ? 'لا توجد أنشطة حتى الآن.' : 'No activities yet.'}</td></tr>`;
      }
    }

    // ---- Login & Password Reset (Enterprise API) ----
    function openResetPasswordModal() {
      const currentLoginUser = document.getElementById('login-username') ? document.getElementById('login-username').value.trim() : '';
      const identifierInp = document.getElementById('reset-user-identifier');
      if (identifierInp) {
        identifierInp.value = currentLoginUser || 'qsem.othman';
      }
      const passInp = document.getElementById('reset-new-password');
      if (passInp) passInp.value = 'Admin123';
      const fb = document.getElementById('reset-feedback-msg');
      if (fb) fb.classList.add('hidden');
      const m = document.getElementById('login-reset-pass-modal');
      if (m) m.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function closeResetPasswordModal() {
      const m = document.getElementById('login-reset-pass-modal');
      if (m) m.classList.add('hidden');
    }

    async function handleResetPasswordSubmit(e) {
      if (e) e.preventDefault();
      const identifier = document.getElementById('reset-user-identifier').value.trim();
      const newPass = document.getElementById('reset-new-password').value.trim();
      const fb = document.getElementById('reset-feedback-msg');
      const isAr = currentLang === 'ar';

      if (!identifier) {
        alert(isAr ? 'يرجى كتابة اسم المستخدم أو البريد' : 'Please enter username or email.');
        return;
      }
      if (!newPass) {
        alert(isAr ? 'يرجى كتابة كلمة المرور الجديدة' : 'Please enter new password.');
        return;
      }

      try {
        const res = await api('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({
            username_or_email: identifier,
            new_password: newPass
          })
        });

        if (fb) {
          fb.className = "text-xs font-bold p-3 rounded-xl border bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 block leading-relaxed";
          fb.textContent = isAr 
            ? `✅ تم تحديث كلمة المرور للمستخدم "${identifier}" بنجاح إلى: ${newPass}! جاري تسجيل الدخول...`
            : `✅ Password for "${identifier}" updated successfully to: ${newPass}! Logging in...`;
        }

        // Auto-fill login fields
        const userInp = document.getElementById('login-username');
        if (userInp) userInp.value = identifier;
        const passInp = document.getElementById('login-password');
        if (passInp) passInp.value = newPass;

        setTimeout(() => {
          closeResetPasswordModal();
          handleLoginSubmit();
        }, 1200);

      } catch (err) {
        if (fb) {
          fb.className = "text-xs font-bold p-3 rounded-xl border bg-rose-50 dark:bg-rose-950/60 text-rose-800 dark:text-rose-300 border-rose-200 dark:border-rose-800 block leading-relaxed";
          fb.textContent = (isAr ? 'فشل إعادة التعيين: ' : 'Reset failed: ') + err.message;
        }
      }
    }

    async function handleLoginSubmit(e) {
      if (e) e.preventDefault();
      const user = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      try {
        const data = await api('/auth/login', { 
          method: 'POST', 
          body: JSON.stringify({ 
            email: user, 
            password: pass 
          }) 
        });
        localStorage.setItem('spma_token', data.access_token);
        if (data.user) {
          localStorage.setItem('spma_user', JSON.stringify(data.user));
        }
      } catch (err) {
        const msg = currentLang === 'ar' 
          ? 'بيانات الدخول غير صحيحة. يمكنك الضغط على "Forgot / Reset Password" بالأسفل لتغيير كلمة المرور أو اسم الدخول فوراً.' 
          : 'Invalid username or password. You can click "Forgot / Reset Password" below to reset your password or update your login credentials.';
        alert(msg);
        return;
      }
      enterWorkspace();
      loadLive();
      loadAlerts();
      loadUsers();
      loadEngChatMessages(true);
      loadGeminiSettings();
    }
    function handleLogout() {
      localStorage.removeItem('spma_token');
      localStorage.removeItem('spma_user');
      showLoginPortal();
    }

    // ---- Projects ----
    async function handleAddProjectSubmit(e) {
      e.preventDefault();
      try {
        await api('/projects', { method: 'POST', body: JSON.stringify({
          name: document.getElementById('new-prj-name').value,
          code: document.getElementById('new-prj-code').value,
          total_budget: parseFloat(document.getElementById('new-prj-budget').value) || 0,
          currency: 'SAR'
        }) });
        closeAddProjectModal();
        await loadLive();
        switchTab('projects');
      } catch (err) { alert('Failed to create project: ' + err.message); }
    }
    async function activateProject(id) {
      try { await api('/projects/' + encodeURIComponent(id) + '/activate', { method: 'POST' }); await loadLive(); }
      catch (err) { alert('Failed to activate project: ' + err.message); }
    }
    async function deleteProject(id) {
      const p = LIVE.projects.find(x => x.project_id === id);
      const prjName = p ? getBilingualProjectName(p) : id;
      const msg = currentLang === 'ar' ? `هل أنت متأكد من حذف المشروع "${prjName}"؟` : `Are you sure you want to delete project "${prjName}"?`;
      if (!confirm(msg)) return;
      try {
        await api('/projects/' + encodeURIComponent(id), { method: 'DELETE' });
        await loadLive();
      } catch (err) { alert((currentLang === 'ar' ? 'فشل حذف المشروع: ' : 'Failed to delete project: ') + err.message); }
    }
    function switchActiveProject(id) {
      try { localStorage.setItem('spma_selected_project_id', id); } catch (e) {}
      if (typeof LIVE !== 'undefined' && LIVE && LIVE.projects) {
        const found = LIVE.projects.find(x => x.project_id === id);
        if (found) {
          const aiPrjNameEl = document.getElementById('ai-active-project-name');
          if (aiPrjNameEl) aiPrjNameEl.textContent = getBilingualProjectName(found);
        }
      }
      activateProject(id);
    }
    function closeWorkspaceModal() {
      const m = document.getElementById('workspace-modal');
      if (m) m.classList.add('hidden');
    }

    function openWorkspaceModal(id) {
      const p = LIVE.projects.find(x => x.project_id === id) || LIVE.projects[0];
      if (!p) return;
      
      const isAr = currentLang === 'ar';
      const titleEl = document.getElementById('ws-modal-title');
      if (titleEl) titleEl.textContent = getBilingualProjectName(p);
      
      const codeEl = document.getElementById('ws-modal-code');
      if (codeEl) codeEl.textContent = p.code || p.project_id;
      
      const prjActivities = LIVE.activities.filter(a => a.project_id === p.project_id || !a.project_id || LIVE.projects.length === 1);
      const totalAC = prjActivities.reduce((s, a) => s + (a.actual_cost || 0), 0);
      const totalEV = prjActivities.reduce((s, a) => s + (a.earned_value || 0), 0);
      const totalPV = prjActivities.reduce((s, a) => s + (a.planned_value || 0), 0);
      const totalBudget = p.total_budget || 931512.29;
      const remaining = Math.max(0, totalBudget - totalAC);
      const completionPct = prjActivities.length ? Math.round(prjActivities.reduce((s, a) => s + pct(a), 0) / prjActivities.length) : 0;
      
      const spi = totalPV > 0 ? (totalEV / totalPV).toFixed(2) : '1.00';
      const cpi = totalAC > 0 ? (totalEV / totalAC).toFixed(2) : '1.00';
      
      const pctEl = document.getElementById('ws-modal-pct');
      if (pctEl) pctEl.textContent = completionPct + '%';
      
      const circleEl = document.getElementById('ws-modal-circle');
      if (circleEl) {
        const circ = 2 * Math.PI * 32;
        circleEl.setAttribute('stroke-dashoffset', circ * (1 - completionPct / 100));
      }
      
      const budgetEl = document.getElementById('ws-modal-total-budget');
      if (budgetEl) budgetEl.textContent = `${p.currency || 'SAR'} ${fmt(totalBudget)}`;
      
      const spentEl = document.getElementById('ws-modal-spent');
      if (spentEl) spentEl.textContent = `${p.currency || 'SAR'} ${fmt(totalAC)}`;
      
      const remEl = document.getElementById('ws-modal-remaining');
      if (remEl) remEl.textContent = `${p.currency || 'SAR'} ${fmt(remaining)}`;
      
      const spiEl = document.getElementById('ws-modal-spi');
      if (spiEl) spiEl.textContent = spi;
      
      const cpiEl = document.getElementById('ws-modal-cpi');
      if (cpiEl) cpiEl.textContent = cpi;
      
      const actHeader = document.getElementById('ws-modal-act-header');
      if (actHeader) actHeader.textContent = isAr ? `أنشطة المشروع (${prjActivities.length})` : `Project Activities (${prjActivities.length})`;

      const actContainer = document.getElementById('ws-modal-activities-list');
      if (actContainer) {
        if (prjActivities.length === 0) {
          actContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">${isAr ? 'لا توجد أنشطة لهذا المشروع' : 'No activities found for this project.'}</p>`;
        } else {
          actContainer.innerHTML = prjActivities.map(a => {
            const [badgeLabel, badgeCls] = statusBadge(a.status);
            const actName = getBilingualActivityName(a.name);
            return `
              <div class="bg-slate-50 dark:bg-[#0E2447] p-3 rounded-2xl border border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs gap-3">
                <div>
                  <p class="font-bold text-slate-900 dark:text-white">${esc(actName)}</p>
                  <p class="text-[10px] text-slate-400">${isAr ? 'تاريخ التسليم: ' : 'Planned End: '} ${esc(a.finish_date)} • ${isAr ? 'المصروف: ' : 'Spent: '} ${p.currency || 'SAR'} ${fmt(a.actual_cost)}</p>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <span class="px-2 py-0.5 ${badgeCls} rounded text-[10px] font-bold">${badgeLabel}</span>
                  <button onclick="openEditActivityById('${esc(a.activity_id)}')" class="px-2.5 py-1 bg-white dark:bg-[#132F5C] border border-slate-200 dark:border-slate-700 rounded-lg font-bold text-indigo-600 dark:text-indigo-300 hover:bg-slate-100 dark:hover:bg-slate-800">${isAr ? 'تعديل' : 'Edit'}</button>
                  <button onclick="deleteActivity('${esc(a.activity_id)}')" class="px-2.5 py-1 bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 text-rose-600 rounded-lg font-bold">${isAr ? 'حذف' : 'Delete'}</button>
                </div>
              </div>
            `;
          }).join('');
        }
      }
      
      const modal = document.getElementById('workspace-modal');
      if (modal) modal.classList.remove('hidden');
      lucide.createIcons();
    }

    // ---- Activities ----
    const toApiStatus = st => st === 'completed' ? 'Completed' : st === 'delayed' ? 'Delayed' : 'In Progress';
    async function handleAddActivitySubmit(e) {
      e.preventDefault();
      const prog = Math.max(0, Math.min(100, parseFloat(document.getElementById('new-act-prog').value) || 0));
      const spent = parseFloat(document.getElementById('new-act-spent').value) || 0;
      const planned = Math.max(spent, 10000);
      try {
        await api('/documents/activity', { method: 'POST', body: JSON.stringify({
          activity_id: 'ACT-' + Date.now().toString(36).toUpperCase(),
          name: document.getElementById('new-act-name').value,
          start_date: new Date().toISOString().slice(0, 10),
          finish_date: document.getElementById('new-act-end').value,
          planned_value: planned, earned_value: planned * prog / 100, actual_cost: spent,
          status: toApiStatus(document.getElementById('new-act-status').value)
        }) });
        closeAddActivityModal();
        await loadLive();
      } catch (err) { alert('Failed to save activity: ' + err.message); }
    }
    function openEditActivityById(id) {
      const a = LIVE.activities.find(x => x.activity_id === id);
      if (!a) return;
      editingActivityId = id;
      const s = String(a.status).toLowerCase();
      openEditActivityModal(getBilingualActivityName(a.name), '', a.finish_date, pct(a), a.actual_cost, s.includes('delay') ? 'delayed' : s.includes('complete') ? 'completed' : 'in_progress');
    }
    async function handleEditActivitySubmit(e) {
      e.preventDefault();
      const a = LIVE.activities.find(x => x.activity_id === editingActivityId);
      if (!a) return closeEditActivityModal();
      const prog = Math.max(0, Math.min(100, parseFloat(document.getElementById('edit-act-prog').value) || 0));
      try {
        await api('/documents/activity', { method: 'POST', body: JSON.stringify({
          ...a, finish_date: document.getElementById('edit-act-end').value,
          earned_value: a.planned_value * prog / 100,
          actual_cost: parseFloat(document.getElementById('edit-act-spent').value) || 0,
          status: toApiStatus(document.getElementById('edit-act-status').value)
        }) });
        closeEditActivityModal();
        await loadLive();
      } catch (err) { alert('Failed to update activity: ' + err.message); }
    }
    async function deleteActivity(id) {
      const a = LIVE.activities.find(x => x.activity_id === id);
      const actName = a ? getBilingualActivityName(a.name) : id;
      const msg = currentLang === 'ar' ? `هل أنت متأكد من حذف النشاط "${actName}"؟` : `Are you sure you want to delete activity "${actName}"?`;
      if (!confirm(msg)) return;
      try {
        await api('/documents/activities/' + encodeURIComponent(id), { method: 'DELETE' });
        await loadLive();
      } catch (err) { alert((currentLang === 'ar' ? 'فشل حذف النشاط: ' : 'Failed to delete activity: ') + err.message); }
    }
    function filterActivitiesByStatus(st) {
      const tabs = ['all', 'delayed', 'in_progress', 'completed'];
      tabs.forEach(t => {
        const btn = document.getElementById('act-tab-' + t);
        if (btn) {
          if (t === st) {
            btn.className = 'px-3 py-1 bg-white dark:bg-[#0B1E3B] border border-slate-200 dark:border-slate-700 rounded-lg font-bold text-[#0B1E3B] dark:text-white shadow-2xs';
          } else {
            btn.className = 'px-3 py-1 text-slate-500 dark:text-slate-400 hover:text-slate-800 font-semibold';
          }
        }
      });
      const rows = document.querySelectorAll('#activities-tbody tr');
      rows.forEach(r => {
        const rowSt = r.getAttribute('data-status');
        if (st === 'all' || rowSt === st) {
          r.style.display = '';
        } else {
          r.style.display = 'none';
        }
      });
    }

    function renderHealth(audit, kpi) {
      const hc = cardOf('i18n-proj-health-title');
      if (!hc || !audit) return;
      const isAr = currentLang === 'ar';
      const score = Number(audit.health_score) || 0;
      const st = String(audit.health_status || '').toUpperCase();
      const cls = score >= 75 ? 'Healthy' : score >= 50 ? 'Warning' : 'Critical';
      const color = score >= 75 ? '#10B981' : score >= 50 ? '#F59E0B' : '#F43F5E';
      const circ = 2 * Math.PI * 32;
      const counts = { Healthy: 0, Warning: 0, Critical: 0 }; counts[cls] = 1;
      hc.innerHTML = `<div class="space-y-1">
          <span id="i18n-proj-health-title" class="text-xs font-bold text-[#0B1E3B] dark:text-white">${isAr ? 'مؤشر صحة المشروع' : 'Project Health'}</span>

          <div class="flex items-center gap-3 pt-2 text-[10px] font-bold">
            <span class="text-emerald-600 dark:text-emerald-400">● ${isAr ? 'سليم' : 'Healthy'}: ${counts.Healthy}</span>
            <span class="text-amber-500">● ${isAr ? 'تحذير' : 'Warning'}: ${counts.Warning}</span>
            <span class="text-rose-500">● ${isAr ? 'حرج' : 'Critical'}: ${counts.Critical}</span></div></div>
        <div class="relative w-20 h-20 flex items-center justify-center">
          <svg class="w-full h-full transform -rotate-90">
            <circle cx="40" cy="40" r="32" stroke="currentColor" class="text-slate-100 dark:text-slate-800" stroke-width="8" fill="transparent"/>
            <circle cx="40" cy="40" r="32" stroke="${color}" stroke-width="8" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - score / 100)}" fill="transparent" stroke-linecap="round"/></svg>
          <span class="absolute font-black text-xs text-[#0B1E3B] dark:text-white">${score}%</span></div>`;
    }

    function isCurrentUserSender(m, myUser) {
      if (!myUser || !m) return false;
      const myName = String(myUser.full_name || myUser.name || '').toLowerCase().trim();
      const myEmail = String(myUser.email || '').toLowerCase().trim();
      const sName = String(m.sender_name || '').toLowerCase().trim();
      const sEmail = String(m.sender_email || '').toLowerCase().trim();

      if (myEmail && sEmail && myEmail === sEmail) return true;
      if (myName && sName && myName === sName) return true;

      const cleanMy = myName.replace(/^(engr\.|eng\.|dr\.)\s*/i, '').trim();
      const cleanS = sName.replace(/^(engr\.|eng\.|dr\.)\s*/i, '').trim();
      if (cleanMy && cleanS) {
        if (cleanMy === cleanS || cleanMy.includes(cleanS) || cleanS.includes(cleanMy)) return true;
      }
      return false;
    }

    function getSenderColor(name) {
      const n = String(name || '').toLowerCase();
      if (n.includes('yasser') || n.includes('director')) return 'bg-blue-600 text-white';
      if (n.includes('asem') || n.includes('qsem')) return 'bg-indigo-600 text-white';
      if (n.includes('gassim') || n.includes('mohammed gassim')) return 'bg-amber-600 text-white';
      if (n.includes('saleh')) return 'bg-emerald-600 text-white';
      if (n.includes('rafat')) return 'bg-cyan-600 text-white';
      if (n.includes('abubaker') || n.includes('baker')) return 'bg-rose-600 text-white';
      return 'bg-purple-600 text-white';
    }

    function getSenderInitials(name) {
      const clean = String(name || 'Eng').replace(/^(engr\.|eng\.|dr\.)\s*/i, '').trim();
      const parts = clean.split(/\s+/);
      return parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : clean.slice(0, 2).toUpperCase();

    async function loadEngChatMessages(force = false) {
      const stream = document.getElementById('eng-chat-stream');
      if (!stream) return;
      try {
        const msgs = await api('/chat/team/messages?channel_id=' + encodeURIComponent(engChatChannel));
        RAW_ENG_MESSAGES = msgs || [];

        const engTab = document.getElementById('tab-engineer-chat');
        const isHidden = !engTab || engTab.classList.contains('hidden');

        if (msgs.length > lastEngMsgCount) {
          if (isHidden && lastEngMsgCount > 0) {
            const badge = document.getElementById('chat-unread-badge');
            const mobBadge = document.getElementById('mob-chat-badge');
            const diff = msgs.length - lastEngMsgCount;
            if (badge) {
              badge.textContent = `+${diff}`;
              badge.classList.remove('hidden');
            }
            if (mobBadge) {
              mobBadge.textContent = `+${diff}`;
              mobBadge.classList.remove('hidden');
            }
          }
        }

        if (!force && msgs.length === lastEngMsgCount && stream.children.length > 0 && !engChatSearchTerm) {
          return;
        }

        lastEngMsgCount = msgs.length;
        renderEngChatMessages(RAW_ENG_MESSAGES);
      } catch (err) {
        console.warn('Failed to fetch team chat messages:', err.message);
      }
    }

    function filterEngChatMessages(term) {
      engChatSearchTerm = (term || '').trim();
      renderEngChatMessages(RAW_ENG_MESSAGES);
    }

        email: document.getElementById('edit-user-email').value.trim(),
        role: document.getElementById('edit-user-role').value,
        phone: document.getElementById('edit-user-phone').value.trim()
      };
      if (passVal) {
        payload.password = passVal;
      }

      try {
        await api('/auth/users/' + encodeURIComponent(uid), {
          method: 'PUT',
          body: JSON.stringify(payload)
        });
        closeEditUserModal();
        await loadUsers();
        alert(currentLang === 'ar' ? '✅ تم تحديث بيانات المستخدم وحفظ كلمة المرور بنجاح!' : '✅ User profile & credentials updated successfully!');
      } catch (err) {
        alert('Failed to update user: ' + err.message);
      }
    }

    async function deleteUser(uid) {
      const u = LIVE_USERS.find(x => x.user_id === uid || x.email === uid);
      const msg = currentLang === 'ar' ? `هل أنت تأكد من حذف المستخدم "${u ? u.full_name : uid}"؟` : `Are you sure you want to delete user "${u ? u.full_name : uid}"?`;
      if (!confirm(msg)) return;

      try {
        await api('/auth/users/' + encodeURIComponent(uid), { method: 'DELETE' });
        await loadUsers();
      } catch (err) {
        alert((currentLang === 'ar' ? 'فشل حذف المستخدم: ' : 'Failed to delete user: ') + err.message);
      }
    }

    // =========================================================================
    // GEMINI API SETTINGS & CONNECTION TEST
    // =========================================================================
    let currentGeminiSettings = null;

    async function loadGeminiSettings() {
      try {
        const data = await api('/settings/gemini');
        currentGeminiSettings = data;

        const keyInput = document.getElementById('settings-gemini-key');
        if (keyInput && data.gemini_api_key) {
          keyInput.value = data.gemini_api_key;
        }

        const modelSelect = document.getElementById('settings-gemini-model');
        if (modelSelect && data.gemini_model) {
          modelSelect.value = data.gemini_model;
        }

        updateGeminiStatusBadge(data.is_configured);
        updateActiveModelBadge(data.gemini_model);
      } catch (err) {
        console.warn('Could not load Gemini settings:', err.message);
      }
    }

    function updateActiveModelBadge(model) {
      const badgeText = document.getElementById('ai-model-badge-text');
      if (!badgeText) return;
      const m = (model || (currentGeminiSettings && currentGeminiSettings.gemini_model) || 'gemini-3.7-flash').toLowerCase();
      if (m.includes('3.7')) badgeText.textContent = 'Gemini 3.7 Flash Grounded';
      else if (m.includes('3.8')) badgeText.textContent = 'Gemini 3.8 Flash Grounded';
      else if (m.includes('2.5-pro')) badgeText.textContent = 'Gemini 2.5 Pro Grounded';
      else if (m.includes('2.5')) badgeText.textContent = 'Gemini 2.5 Flash Grounded';
      else if (m.includes('1.5')) badgeText.textContent = 'Gemini 1.5 Flash Grounded';
      else badgeText.textContent = `${model} Grounded`;
    }

    function updateGeminiStatusBadge(isConfigured) {
      const badge = document.getElementById('gemini-status-badge');
      const dot = document.getElementById('gemini-status-dot');
      const text = document.getElementById('gemini-status-text');

      if (!badge || !text) return;

      if (isConfigured) {
        badge.className = "px-2.5 py-1 rounded-full text-[10px] font-black bg-emerald-100 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-300 flex items-center gap-1.5 shadow-xs";
        if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        text.textContent = currentLang === 'ar' ? 'مفعل وجاهز' : 'Active & Configured';
      } else {
        badge.className = "px-2.5 py-1 rounded-full text-[10px] font-black bg-amber-100 dark:bg-amber-950/80 text-amber-700 dark:text-amber-300 flex items-center gap-1.5 shadow-xs";
        if (dot) dot.className = "w-2 h-2 rounded-full bg-amber-500";
        text.textContent = currentLang === 'ar' ? 'غير مهيأ' : 'Not Configured';
      }
    }

    function toggleGeminiKeyVisibility() {
      const input = document.getElementById('settings-gemini-key');
      const icon = document.getElementById('gemini-key-eye-icon');
      if (!input) return;

      if (input.type === 'password') {
        input.type = 'text';
        if (icon) icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        if (icon) icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) lucide.createIcons();
    }

    function copyGeminiKey() {
      const input = document.getElementById('settings-gemini-key');
      if (!input || !input.value) {
        showGeminiFeedback(currentLang === 'ar' ? 'لا يوجد مفتاح لنسخه!' : 'No key to copy!', 'warn');
        return;
      }
      navigator.clipboard.writeText(input.value).then(() => {
        const copyIcon = document.getElementById('gemini-key-copy-icon');
        if (copyIcon) copyIcon.setAttribute('data-lucide', 'check');
        if (window.lucide) lucide.createIcons();

        showGeminiFeedback(currentLang === 'ar' ? 'تم نسخ مفتاح Gemini API إلى الحافظة!' : 'Gemini API key copied to clipboard!', 'success');

        setTimeout(() => {
          if (copyIcon) copyIcon.setAttribute('data-lucide', 'copy');
          if (window.lucide) lucide.createIcons();
        }, 2000);
      }).catch(err => {
        showGeminiFeedback(currentLang === 'ar' ? 'فشل النسخ: ' + err.message : 'Failed to copy: ' + err.message, 'error');
      });
    }

    async function saveGeminiApiKey() {
      const keyInput = document.getElementById('settings-gemini-key');
      const modelSelect = document.getElementById('settings-gemini-model');
      const saveBtn = document.getElementById('btn-save-gemini');
      const saveIcon = document.getElementById('btn-save-gemini-icon');

      const apiKey = keyInput ? keyInput.value.trim() : '';
      const model = modelSelect ? modelSelect.value : 'gemini-2.5-flash';

      if (!apiKey) {
        showGeminiFeedback(currentLang === 'ar' ? 'يرجى إدخال مفتاح Gemini API صالح.' : 'Please enter a valid Gemini API key.', 'warn');
        return;
      }

      if (saveBtn) saveBtn.disabled = true;
      if (saveIcon) {
        saveIcon.setAttribute('data-lucide', 'loader-2');
        saveIcon.classList.add('animate-spin');
      }
      if (window.lucide) lucide.createIcons();

      try {
        const res = await api('/settings/gemini', {
          method: 'POST',
          body: JSON.stringify({ gemini_api_key: apiKey, gemini_model: model })
        });

        updateGeminiStatusBadge(true);
        updateActiveModelBadge(model);
        showGeminiFeedback(currentLang === 'ar' ? '✅ تم حفظ مفتاح Gemini API وتحديث ملفات الإعدادات بنجاح!' : '✅ Gemini API key saved and configuration updated successfully!', 'success');

        // Automatically trigger live connection test to verify the new key
        await testGeminiApiConnection();
      } catch (err) {
        showGeminiFeedback((currentLang === 'ar' ? '❌ فشل حفظ المفتاح: ' : '❌ Failed to save API key: ') + err.message, 'error');
      } finally {
        if (saveBtn) saveBtn.disabled = false;
        if (saveIcon) {
          saveIcon.classList.remove('animate-spin');
          saveIcon.setAttribute('data-lucide', 'save');
        }
        if (window.lucide) lucide.createIcons();
      }
    }

    async function testGeminiApiConnection() {
      const keyInput = document.getElementById('settings-gemini-key');
      const modelSelect = document.getElementById('settings-gemini-model');
      const testBtn = document.getElementById('btn-test-gemini');
      const testIcon = document.getElementById('btn-test-gemini-icon');

      const banner = document.getElementById('gemini-ping-banner');
      const statusText = document.getElementById('gemini-ping-status');
      const latencyPill = document.getElementById('gemini-ping-latency');
      const dot = document.getElementById('gemini-ping-dot');

      const apiKey = keyInput ? keyInput.value.trim() : '';
      const model = modelSelect ? modelSelect.value : 'gemini-2.5-flash';

      // Set testing state
      if (testBtn) testBtn.disabled = true;
      if (testIcon) {
        testIcon.setAttribute('data-lucide', 'loader-2');
        testIcon.classList.add('animate-spin');
      }
      if (banner) {
        banner.className = "p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-xl flex items-center justify-between transition-colors";
      }
      if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";
      if (statusText) {
        statusText.className = "text-xs font-bold text-amber-800 dark:text-amber-300";
        statusText.textContent = currentLang === 'ar' ? 'جاري فحص الاتصال بـ Google Gemini API...' : 'Pinging Google Gemini Generative Language API...';
      }
      if (latencyPill) {
        latencyPill.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 dark:bg-amber-900/60 text-amber-700 dark:text-amber-300";
        latencyPill.textContent = "...";
      }
      if (window.lucide) lucide.createIcons();

      try {
        const res = await api('/settings/gemini/test', {
          method: 'POST',
          body: JSON.stringify({ gemini_api_key: apiKey, gemini_model: model })
        });

        if (res.status === 'success') {
          if (banner) banner.className = "p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-xl flex items-center justify-between transition-colors";
          if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
          if (statusText) {
            statusText.className = "text-xs font-bold text-emerald-800 dark:text-emerald-300";
            statusText.textContent = currentLang === 'ar' 
              ? `الاتصال ناجح! استجابة Gemini (${res.model}): "${res.reply || 'OK'}"` 
              : `Connection Healthy! Model: ${res.model} — Response: "${res.reply || 'OK'}"`;
          }
          if (latencyPill) {
            latencyPill.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300";
            latencyPill.textContent = `${res.latency_ms}ms latency`;
          }
          showGeminiFeedback(currentLang === 'ar' ? `⚡ فحص الاتصال ناجح في ${res.latency_ms} مللي ثانية!` : `⚡ Ping successful in ${res.latency_ms}ms!`, 'success');
        } else {
          const isQuota = res.error_code === 'QUOTA_EXCEEDED' || (res.message && res.message.includes('429'));
          if (banner) {
            banner.className = isQuota 
              ? "p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-800 rounded-xl flex items-center justify-between transition-colors"
              : "p-3 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 rounded-xl flex items-center justify-between transition-colors";
          }
          if (dot) dot.className = isQuota ? "w-2.5 h-2.5 rounded-full bg-amber-500" : "w-2.5 h-2.5 rounded-full bg-rose-500";
          if (statusText) {
            statusText.className = isQuota ? "text-xs font-bold text-amber-900 dark:text-amber-200 leading-relaxed" : "text-xs font-bold text-rose-800 dark:text-rose-300";
            if (isQuota) {
              statusText.textContent = currentLang === 'ar'
                ? `تنبيه الحصة المجانية (Quota 429): تم استهلاك الحد اليومي لنموذج ${res.model || model} (20 طلباً/يوم). الصلاحية ستتجدد تلقائياً، أو يمكنك وضع مفتاح مجاني جديد من Google AI Studio.`
                : `Free Quota Limit (429): Daily limit (20 req/day) exhausted for model ${res.model || model}. Quota will reset automatically, or paste a fresh free key from Google AI Studio.`;
            } else {
              statusText.textContent = currentLang === 'ar' ? `خطأ في الاتصال: ${res.message}` : `Connection Error: ${res.message}`;
            }
          }
          if (latencyPill) {
            latencyPill.className = isQuota
              ? "text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-300"
              : "text-[10px] font-bold px-2 py-0.5 rounded bg-rose-100 dark:bg-rose-900/60 text-rose-700 dark:text-rose-300";
            latencyPill.textContent = isQuota ? "Quota 429" : "Failed";
          }
          showGeminiFeedback(res.message, isQuota ? 'warn' : 'error');
        }
      } catch (err) {
        if (banner) banner.className = "p-3 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 rounded-xl flex items-center justify-between transition-colors";
        if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
        if (statusText) {
          statusText.className = "text-xs font-bold text-rose-800 dark:text-rose-300";
          statusText.textContent = (currentLang === 'ar' ? 'فشل فحص الاتصال: ' : 'Ping Failed: ') + err.message;
        }
        if (latencyPill) {
          latencyPill.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-rose-100 dark:bg-rose-900/60 text-rose-700 dark:text-rose-300";
          latencyPill.textContent = "Error";
        }
        showGeminiFeedback(err.message, 'error');
      } finally {
        if (testBtn) testBtn.disabled = false;
        if (testIcon) {
          testIcon.classList.remove('animate-spin');
          testIcon.setAttribute('data-lucide', 'activity');
        }
        if (window.lucide) lucide.createIcons();
      }
    }

    function showGeminiFeedback(msg, type = 'info') {
      const fb = document.getElementById('gemini-feedback-msg');
      if (!fb) return;

      fb.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200', 'bg-amber-50', 'text-amber-800', 'border-amber-200', 'dark:bg-emerald-950/60', 'dark:text-emerald-300', 'dark:border-emerald-800', 'dark:bg-rose-950/60', 'dark:text-rose-300', 'dark:border-rose-800');

      if (type === 'success') {
        fb.className = "text-xs font-bold p-3 rounded-xl border bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 block";
      } else if (type === 'error') {
        fb.className = "text-xs font-bold p-3 rounded-xl border bg-rose-50 dark:bg-rose-950/60 text-rose-800 dark:text-rose-300 border-rose-200 dark:border-rose-800 block";
      } else {
        fb.className = "text-xs font-bold p-3 rounded-xl border bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border-amber-200 dark:border-amber-800 block";
      }

      fb.textContent = msg;
      setTimeout(() => {
        if (fb) fb.classList.add('hidden');
      }, 6000);
    }

    function refreshCurrentPage() {
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('animate-spin');
      Promise.all([loadLive(), loadAlerts(), loadEngChatMessages(), loadUsers(), loadGeminiSettings()]).finally(() => icon && icon.classList.remove('animate-spin'));
    }

    window.addEventListener('load', () => {
      if (localStorage.getItem('spma_auth') === 'true') {
        loadLive();
        loadAlerts();
        loadEngChatMessages();
        loadUsers();
        loadGeminiSettings();
      }
      setInterval(() => {
        loadEngChatMessages();
      }, 2000);

      // Hook language switcher so dynamic cards, timelines, and activity tables re-render instantly on language change
      const origToggleLang = window.toggleLanguage;
      if (typeof origToggleLang === 'function') {
        window.toggleLanguage = function() {
          origToggleLang();
          if (LIVE && LIVE.projects && LIVE.projects.length) {
            renderLive();
          }
          if (LIVE && LIVE.audit) {
            renderAlerts(LIVE.audit);
            renderHealth(LIVE.audit, LIVE.kpi);
          }
        };
      }
    });
  </script>
